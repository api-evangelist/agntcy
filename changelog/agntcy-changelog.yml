- project: dir
  version: v1.7.0
  date: '2026-08-18'
  breaking: false
  highlights:
  - New POST /v1/search HTTP endpoint with parity to dirctl search, removing the gRPC-only constraint for programmatic and
    gateway-driven search.
  - New POST /v1/extract endpoint for OASF taxonomy extraction from free-form text.
  - OASF extractor unified across dirctl, the gateway and import workflows.
  - dirctl routing publish --all publishes every locally stored record to the DHT in one operation.
  - Directory API and OCI registry endpoints can now be advertised separately in routing.
  - Client and CLI refresh OIDC tokens on the fly.
  source: https://github.com/agntcy/dir/releases/tag/v1.7.0
