      description: Get OASF skills taxonomy tree with nested categories, subcategories, classes, and subclasses. If id (numeric) or name (string) query parameter is provided, returns only the children of that parent. Name can be in hierarchical format (e.g., 'natural_language_processing/natural_language_understanding/contextual_comprehension') or simple format (e.g., 'contextual_comprehension').
      operationId: SchemaWeb.SchemaController.skill_categories
      parameters:
      - description: Related schema extensions to include in response.
        in: query
        name: extensions
