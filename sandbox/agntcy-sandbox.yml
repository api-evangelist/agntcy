local_environments:
- name: Directory local deployment
  docs: https://dir.agntcy.org/latest/dir/dir-deployment-local/
  note: Run a Directory node locally; dirctl defaults to 0.0.0.0:8888 with auth auto-detect falling back to insecure for local
    development.
- name: Self-hosted OASF schema server
  docs: https://github.com/agntcy/oasf
  note: OASF_API_VALIDATION_SCHEMA_URL can point dirctl at a local schema server (e.g. http://localhost:8080).
- name: coffeeAgntcy reference application
  repo: https://github.com/agntcy/coffeeAgntcy
  docs: https://docs.agntcy.org/coffee-agntcy/get-started/
  note: End-to-end runnable reference app exercising DIR, SLIM and Identity together — the closest thing AGNTCY has to a sandbox.
- name: CSIT integration test suite
  repo: https://github.com/agntcy/csit
  note: Continuous System Integration Testing harness for AGNTCY projects.
auth_modes_for_testing:
- none
- insecure
auth_modes_note: dirctl --auth-mode=none and --auth-mode=insecure are the documented local-development modes; SPIFFE modes
  (x509, jwt, token) require an explicit flag.
