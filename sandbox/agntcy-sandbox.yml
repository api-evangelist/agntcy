source: https://schema.oasf.outshift.com/doc, https://dir.agntcy.org/latest/dir/dir-quickstart/, https://github.com/agntcy/coffeeAgntcy
note: AGNTCY has no test-vs-live key model — there are no keys to issue. What it publishes instead is an anonymously callable
  hosted schema API with an interactive console, plus local deployment paths for everything else. No test credentials, cards,
  tokens or fixtures exist to capture, and none are invented here.
test_live_separation:
  exists: false
  note: No test/live modes, no key prefixes. The Identity Service does define an x-id-api-key header, but keys are minted
    by whoever operates the deployment, not by AGNTCY.
public_console:
  url: https://schema.oasf.outshift.com/doc
  status: 200
  type: swagger-ui
  auth: none
  note: Swagger UI over the live OASF Schema API. Every operation is callable anonymously against the real service — 31 operations
    across schema browsing, sample generation, taxonomy translation and record validation.
public_endpoints_no_auth:
