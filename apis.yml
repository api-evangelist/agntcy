  name: AGNTCY Thread Runs API
  description: "Thread Runs are runs created on a thread. \nA Thread Run can be created on a thread **only**\
    \ if there is no run in the `pending` status on the same thread, i.e. if the thread is in the state\
    \ `idle`\nNote that runs over the same thread can be executed on different agents, as long as the\
    \ agents support the same thread state format.\nSee `Thread` and `RunCreateStateful` for more info."
