aid: agntcy
name: AGNTCY
description: 'AGNTCY is the open collective for agent interoperability initiated by Outshift, Cisco''s incubation
  group, and now developed in the open across more than fifty active repositories. It publishes specifications rather
  than a product API: OASF (Open Agentic Schema Framework) for describing agents, the Agent Directory (DIR) for
  announcing and discovering multi-agent systems, SLIM (Secure Low-Latency Interactive Messaging) as a transport,
  and an Identity specification for onboarding and verifying agent identities. It ships SDKs in Python, JavaScript,
  Go and Rust, an MCP server for DIR, and SLIM transports for the A2A SDKs in five languages.'
