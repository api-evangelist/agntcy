apis:
- name: Agent Directory (DIR)
  description: >-
    Distributed announce and discovery of multi-agent systems. gRPC-first, with services for storage (content-addressed
    by CID), routing over a DHT, structured search, signing and verification, domain name verification,
    peer sync, streaming events and runtime discovery. Canonical schemas are published on buf.build.
  humanURL: https://dir.agntcy.org/
  image: https://agntcy.org/logo/preview-thumbnail-new.png
  tags:
  - Agent Discovery
  - gRPC
  - Protocol Buffers
  - AI Agents
  properties:
  - type: Protobuf
    url: grpc/_index.yml
  - type: APIReference
    url: https://dir.agntcy.org/latest/dir/dir-api-reference/
  - type: Documentation
    url: https://dir.agntcy.org/
  - type: GettingStarted
    url: https://dir.agntcy.org/latest/dir/dir-quickstart/
  - type: SourceCode
    url: https://github.com/agntcy/dir
  - type: BufRegistry
    url: https://buf.build/agntcy/dir
  - type: LLMsTxt
    url: llms/agntcy-dir-llms.txt
  - type: MCPServer
    url: mcp/agntcy-mcp.yml
  - type: ToolCrosswalk
    url: mcp/agntcy-tool-crosswalk.yml
  - type: CLI
    url: cli/agntcy-cli.yml
  x-no-base-url: >-
    Self-hosted gRPC. dirctl defaults to 0.0.0.0:8888 for a local node; remote access goes through an
    operator-run oidc-gateway. AGNTCY publishes no public Directory endpoint.
- aid: agntcy:agntcy-agents-api
  name: AGNTCY Agents API
  description: "Agents are AI workflows that can be configured and/or executed on this server.  This means\
    \ that a client of this server can start a Run on any of the Agents supported by this server.\nEach\
    \ agent may support different features of ACP, also each agent specifies the schemas of the objects\
    \ carried by ACP for  configuration, input, output, interrupts and state. \nDetails of the ACP features\
    \ and the schemas are kept in the ACP descriptor of the specific agent.  This object can be retrieved\
    \ through this ACP interface or is found in the ACP extension of the agent record in the agent directory.\n\
    See `Agent` and `AgentACPDescriptor` models below for more info."
