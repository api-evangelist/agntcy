aid: agntcy
name: AGNTCY
description: 'AGNTCY is the open collective for agent interoperability, initiated by Outshift — Cisco''s incubation
  group — and governed under the Linux Foundation (LF Projects, LLC), developed in the open across 52 public repositories.
  It publishes specifications rather than a product API: OASF (Open Agentic Schema Framework) for describing agents
  with a versioned record schema and skill/domain taxonomies, the Agent Directory (DIR) for announcing and discovering
  multi-agent systems over gRPC, SLIM (Secure Low-Latency Interactive Messaging) as a transport, the Agent Connect
  Protocol (ACP) as a REST interface for invoking remote agents, and an Identity layer that issues and verifies
  W3C Verifiable Credential badges for agents, MCP servers and tools. One AGNTCY-operated API exists — the OASF
  Schema Server at schema.oasf.outshift.com, unauthenticated and callable by anyone; everything else is a specification
  you implement or software you deploy yourself. It ships SDKs in Python, JavaScript, Go, Rust and .NET, a local-stdio
  MCP server for the Agent Directory, and SLIMRPC transports for the A2A SDKs in five languages. Everything is Apache-2.0;
  there is no pricing, no paid tier and no commercial plan.'
url: https://raw.githubusercontent.com/api-evangelist/agntcy/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
position: Consumer
x-type: company
x-source: cisco-family-buildout:2026-08-19
x-parent: cisco
x-relationship: initiative
x-contract-status: real
x-contract-note: 'Four first-party machine-readable contracts (106 operations): the Agent Connect Protocol OpenAPI
  3.1.1, the OASF Schema API, and two AGNTCY Identity OpenAPI 3.0.3 documents, plus 34 verbatim protobuf definitions.
  schema.oasf.outshift.com is the one genuinely callable AGNTCY-hosted API.'
